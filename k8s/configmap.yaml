apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-metrics-api-config
  labels:
    app.kubernetes.io/name: ai-metrics-api
    app.kubernetes.io/component: inference-gateway
data:
  INFERENCE_LOG_PATH: "/app/data/day02/inference.log"
  LOG_BACKEND: "sqlite"
  SQLITE_LOG_PATH: "/app/data/day02/inference.sqlite3"
  MODEL_BACKEND: "vllm"
  VLLM_BASE_URL: "http://vllm-service:8000/v1"
  VLLM_MODEL: "Qwen/Qwen2.5-0.5B-Instruct"
  MODEL_SERVER_TIMEOUT_SEC: "30"
  MAX_IN_FLIGHT_REQUESTS: "8"
  ADMISSION_MODE: "queue"
  MAX_QUEUE_SIZE: "32"
  QUEUE_TIMEOUT_MS: "500"
  REQUIRE_API_KEY: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_MAX_REQUESTS: "60"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  READINESS_CHECK_BACKEND: "true"
