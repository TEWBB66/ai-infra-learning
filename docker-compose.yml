services:
  ai-metrics-api:
    build: .
    container_name: ai-metrics-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - INFERENCE_LOG_PATH=${INFERENCE_LOG_PATH:-/app/data/day02/inference.log}
      - LOG_BACKEND=${LOG_BACKEND:-file}
      - SQLITE_LOG_PATH=${SQLITE_LOG_PATH:-/app/data/day02/inference.sqlite3}
      - MAX_IN_FLIGHT_REQUESTS=${MAX_IN_FLIGHT_REQUESTS:-8}
      - MODEL_BACKEND=${MODEL_BACKEND:-mock}
      - MOCK_MODEL_SERVER_URL=${MOCK_MODEL_SERVER_URL:-http://mock-model-server:8001/generate}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8001/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      - MODEL_SERVER_TIMEOUT_SEC=${MODEL_SERVER_TIMEOUT_SEC:-30}
      - ADMISSION_MODE=${ADMISSION_MODE:-reject}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-32}
      - QUEUE_TIMEOUT_MS=${QUEUE_TIMEOUT_MS:-500}
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-false}
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-false}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-60}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      - mock-model-server

  mock-model-server:
    build: .
    container_name: mock-model-server
    command: python -m uvicorn projects.mock_model_server.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - MOCK_MODEL_DELAY_SCALE=${MOCK_MODEL_DELAY_SCALE:-0}

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml
    depends_on:
      - ai-metrics-api

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus